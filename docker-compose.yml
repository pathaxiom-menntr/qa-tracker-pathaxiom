version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: qa-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
      POSTGRES_DB: qa_tracker
    ports:
      - "5432:5432"
    volumes:
      - qa_tracker_db_data:/var/lib/postgresql/data
      # Runs automatically on empty database to create all 8 tables and seed initial data
      - ./scripts/migrate.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa-tracker-next-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgres://qa_user:qa_password@db:5432/qa_tracker
      - NODE_ENV=development
      - JWT_SECRET=dev-secret-change-in-production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  qa_tracker_db_data:
