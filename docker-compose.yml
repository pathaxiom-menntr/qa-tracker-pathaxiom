services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa-tracker-next-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://project-backend-1:8080
      - DATABASE_URL=postgres://qa_user:qa_password@project-db-1:5432/qa_tracker
    networks:
      - project_default
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

networks:
  project_default:
    external: true
